name: Build site and generate PDF

# Trigger after the Build and deploy Hugo site workflow completes
on:
  workflow_run:
    workflows: ["Build and deploy Hugo site"]
    types:
      - completed

jobs:
  make-pdf:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install puppeteer and http-server
        run: npm ci --silent --no-audit && npm i puppeteer@latest http-server@latest --save-dev

      - name: Serve public/ and render PDF
        run: |
          npx http-server public -p 8080 &
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox','--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle0' });
            await page.pdf({ path: 'resume.pdf', format: 'A4', printBackground: true });
            await browser.close();
          })();
          "

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf
